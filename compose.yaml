services:
  meleenium:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      STARTGG_BEARER: "${STARTGG_BEARER}"
      STARTGG_EVENT_ID: "${STARTGG_EVENT_ID}"

    ports:
      - "5000:5000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
